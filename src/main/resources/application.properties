spring.application.name=user-service
server.port=8081
clients.account.base-url=${CC_ACCOUNT_URL:http://localhost:8082}
spring.main.web-application-type=servlet

#Connessione ad DB MariaDB
spring.datasource.url=${CC_DB_URL}
spring.datasource.username=${CC_DB_USER}
spring.datasource.password=${CC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Verifica lo schema del database all'avvio
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Rifiuta proprietà JSON non previste dai DTO
spring.jackson.deserialization.fail-on-unknown-properties=true

# Documentazione Swagger/OpenAPI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
security.jwt.secret=${CC_JWT_SECRET}
security.jwt.issuer=${CC_JWT_ISSUER}