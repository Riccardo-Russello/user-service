name: micro-servizi

x-app-environment: &app-environment
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}"
  SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
  SECURITY_JWT_ISSUER: "${CC_JWT_ISSUER}"
  SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"

x-app-defaults: &app-defaults
  secrets:
    - source: db_password
      target: spring.datasource.password
    - source: jwt_secret
      target: security.jwt.secret
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/01-person.sql:/docker-entrypoint-initdb.d/01-person.sql:ro
      - ../account-service/mysql/02-account.sql:/docker-entrypoint-initdb.d/02-account.sql:ro
      - ../transaction-service/mysql/03-accounttransaction.sql:/docker-entrypoint-initdb.d/03-accounttransaction.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/db_password)" mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE"
          -e 'SELECT 1 FROM accounttransaction LIMIT 0'
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.1
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 12

  user-service:
    <<: *app-defaults
    build: .
    environment:
      <<: *app-environment
      CLIENTS_ACCOUNT_BASEURL: "http://account-service:8082"
    ports:
      - "127.0.0.1:8081:8081"

  account-service:
    <<: *app-defaults
    build: ../account-service
    environment:
      <<: *app-environment
      CLIENTS_USER_BASEURL: "http://user-service:8081"
      CLIENTS_TRANSACTION_BASEURL: "http://transaction-service:8083"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      APP_KAFKA_CONSUMER_ENABLED: "true"
    ports:
      - "127.0.0.1:8082:8082"

  transaction-service:
    <<: *app-defaults
    build: ../transaction-service
    environment:
      <<: *app-environment
      CLIENTS_ACCOUNT_BASEURL: "http://account-service:8082"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      APP_KAFKA_PUBLISHER_ENABLED: "true"
    ports:
      - "127.0.0.1:8083:8083"

volumes:
  mysql_data:
  kafka_data:

secrets:
  db_password:
    file: ./.secrets/db_password
  db_root_password:
    file: ./.secrets/db_root_password
  jwt_secret:
    file: ./.secrets/jwt_secret
